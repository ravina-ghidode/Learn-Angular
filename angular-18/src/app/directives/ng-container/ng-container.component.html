<div class="mt-2 p-2 bg-secondary text-white rounded">
    <h1>NG Container </h1>
</div>
<div class="row">
    <div class="col-4">
        <ng-container *ngIf="isContainer">
            <p>This is from ng-container</p>
        </ng-container>

    </div>
    <div class="col-4">
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Sr No</th>
                    <th>Name</th>
                    <th>City</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="isApi">
                    <tr>
                        <td colspan="4" class="text-center">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="spinner-border text-secondary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <div class="spinner-border text-success" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </td>
                    </tr>

                </ng-container>
                <ng-container *ngIf="!isApi">
                    <tr *ngFor="let stu of userList">
                        <td>{{stu.id}}</td>
                        <td>{{stu.name}}</td>
                        <td>{{stu.username}}</td>
                        <td>{{stu.email}}</td>

                    </tr>
                </ng-container>

            </tbody>
        </table>
    </div>
    <div class="col-4">

        <ng-container *ngTemplateOutlet="mytemp">

        </ng-container>

    </div>
</div>
<div class="row">
    <div class="col-4">

    </div>
    <div class="col-4">
        <button class="btn btn-primary" (click)="getUsers()">Load User</button>
    </div>
    <div class="col-4">

    </div>
    <ng-template #mytemp>
        <p>hii from template </p>
    </ng-template>
</div>
